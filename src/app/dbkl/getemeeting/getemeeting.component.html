<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="medium" color="#253d84" type="ball-clip-rotate-multiple"
  [fullScreen]="true">
  
</ngx-spinner>
<!-- Topbar -->
<app-topbar></app-topbar>
<!-- End of Topbar -->
<!-- Header -->
<app-headerc></app-headerc>
<!-- End of Header -->

<main id="main">
  <section class="meeting" id="meeting" style="margin-bottom: 22px">
    <div class="card" >
      <!-- ======= Services Section ======= -->
      <section >
        <div class="container" style="margin-top: 2%; margin-bottom: 2%">
          <div class="text-center">
            <div>
              <img src="../../../assets/img/DBKL LOGO (Lorry).png" height="70" alt="" />
              <h6 style="font-weight: 1000" i18n="@@omp2">KUALA LUMPUR CITY HALL</h6>
              <h6 style="font-weight: 1000" i18n="@@omp1">
                DEPARTMENT OF HEALTH AND ENVIRONMENT
              </h6>
            </div>
          </div>
          <div class="d-flex justify-content-end">
            <button
              printSectionId="main"
              [useExistingCss]="true"
              ngxPrint
              type="button"
              style="border: 1px solid transparent; background: transparent"
            >
              <i
                style="
                  font-size: 30px;
                  color: #419641;
                  cursor: pointer;
                  float: right;
                  margin-top: 12px;
                "
                id="print"
                class="fa fa-print"
                aria-hidden="true"
              ></i>
            </button>
          </div>
          <div class="section-title"> 
            <h2 i18n="@@getem1">E-Meetings-Information Updates</h2>
          </div>

          <form>
            <div class="form-group row">
              <div class="form-group col-md-12">
                <label for="textInput" i18n="@@getem2">Type of Committee</label>
                <input type="text" id="textInput" class="form-control mb-4" name="jawatankuasa_mesurat"
                  placeholder="Input teks" [(ngModel)]="jawatankuasa_mesurat" />
              </div>

              <div class="form-group col-md-12">
                <label for="textInput" i18n="@@getem3">Meeting Type</label>
                <input type="text" id="textInput" class="form-control mb-4" placeholder="Input teks"
                  [(ngModel)]="jenis_mesyuarat" name="jenis_mesyuarat" />
              </div>

              <div class="form-group col-md-12">
                <label for="select" i18n="@@getem4">Department Involved</label>
                <input type="text" id="textInput" class="form-control mb-4" placeholder="Input teks"
                  [(ngModel)]="jabatan_terlibat" name="jabatan_terlibat" />
              </div>

              <div class="form-group col-md-6">
                <label for="textInput" i18n="@@getem5">Date of Meeting</label>
                <input type="date" id="textInput" class="form-control mb-4" placeholder="Input teks"
                  [(ngModel)]="tarikh_mesyuarat" name="tarikh_mesyuarat" />
              </div>
              <div class="form-group col-md-6">
                <label for="textInput" i18n="@@getem6"> Until</label>
                <input type="time" id="textInput" class="form-control mb-4" placeholder="Input teks"
                  [(ngModel)]="hingga" name="hingga" />
              </div>
              <div class="form-group col-md-6">
                <label for="textInput" i18n="@@getem7"> Meeting Time</label>
                <input type="time" id="textInput" class="form-control mb-4" placeholder="Input teks"
                  [(ngModel)]="masa_mesyuarat" name="masa_mesyuarat" />
              </div>
              <div class="form-group col-md-6"></div>

              <div class="form-group col-md-12">
                <label for="textInput" i18n="@@getem8">Chairman</label>
                <input type="text" id="textInput" class="form-control mb-4" placeholder="Input teks"
                  [(ngModel)]="pengerusi" name="pengerusi" />
              </div>

              <div class="form-group col-md-12">
                <label for="textInput" i18n="@@getem9">Meeting Bill</label>
                <input type="text" id="textInput" class="form-control mb-4" placeholder="Input teks"
                  [(ngModel)]="bill_mesyuarat" name="bill_mesyuarat" />
              </div>

              <div class="form-group col-md-12">
                <label for="textarea" i18n="@@getem10">Title of Meeting</label>
                <textarea id="textarea" class="form-control mb-4" placeholder="Kawasan teks"
                  [(ngModel)]="tajuk_mesyuarat" name="tajuk_mesyuarat"></textarea>
              </div>
              <div class="form-group col-md-12">
                <label for="textInput" i18n="@@getem11">Secretary</label>
                <input type="text" id="textInput" class="form-control mb-4" placeholder="Input teks"
                  [(ngModel)]="setiausaha" name="setiausaha" />
              </div>

              <div class="form-group col-md-12">
                <label for="textInput" i18n="@@getem12">Meeting Place</label>
                <input type="text" id="textInput" class="form-control mb-4" placeholder="Input teks"
                  [(ngModel)]="tempat_mesyuarat" name="tempat_mesyuarat" />
              </div>
              <div class="form-group col-md-12">
                <label for="textarea" i18n="@@getem13">Agenda And Minutes</label>
                <textarea style="display: inline-block" id="textarea" class="form-control mb-4"
                  placeholder="Kawasan teks" [(ngModel)]="agenda_dan_minit" name="agenda_dan_minit"></textarea>
              </div>
            </div>
            <div  class="form-group col-md-12" >
            <label  for="textarea" i18n="@@Namafail">Filename:</label>
            <br>
            <label for="file" class="btn-2 d-inline">
            <span>
              <a style="cursor: pointer;color: #253d84;"
              (click)="getPdf(meeting_dokumen)"
                target="_blank"
                >{{ meeting_dokumen }}</a
              ><br /> </span
            ><br /></label></div>
            <div class="form-group col-md-12">
              <label class="custom-file-upload uploade">
                <input
                  type="file"
                  ng2FileSelect
                  accept=".pdf"
                  [uploader]="uploader"
                  name="file"
                 [(ngModel)]="model" 
                  #file="ngModel"
                />
                <i class="fa fa-cloud-upload"></i> Muat Naik Dokumen<br />
                <span class="text-dark">{{ filename }}</span>
              </label>
          </div>
          <ng-template #files>
            <a
              target="_blank"
              (click)="getPdf(meeting_dokumen)"
              >{{ meeting_dokumen }}</a
            > <i id="trash" class="fa fa-trash" (click)="deleteData(data[i].site_id)" aria-hidden="true"></i>
          </ng-template>
            <div id="btnn" class="text-center">
             
              
              <button class="look_for" style="width: 111px; margin-right: 10px"  i18n="@@getem14"
              (click)="updateSubmit()">
              Save
            </button>
            <button class="look_for_red" style="width: 111px"  (click)="search()" type="button" i18n="@@getem15">
              Come back
            </button>
            </div>
          </form>
        </div>
      </section>
      <!-- End Services Section -->
    </div>
  </section>
</main>

<!-- ======= Footer ======= -->
<app-footer></app-footer>
<!-- End Footer -->

<a (click)="backtotop()" class="back-to-top" style="cursor: pointer;display:none;"><i class="icofont-scroll-double-up"></i></a>

<!-- Success Modal Start-->
<div class="modal" id="staticBackdrop" data-backdrop="static" tabindex="-1" role="dialog" [ngStyle]="{ display: display }" aria-labelledby=" staticBackdropLabel " aria-hidden="true ">
  <div class="modal-dialog modal-dialog-centered" role="document ">
      <div class="modal-content">
          <div class="modal-header">
              <div class="swal2-icon swal2-success swal2-animate-success-icon" style="display: flex">
                  <div class="swal2-success-circular-line-left" style="background-color: rgb(255, 255, 255)"></div>
                  <span class="swal2-success-line-tip"></span>
                  <span class="swal2-success-line-long"></span>
                  <div class="swal2-success-ring"></div>
                  <div class="swal2-success-fix" style="background-color: rgb(255, 255, 255)"></div>
                  <div class="swal2-success-circular-line-right" style="background-color: rgb(255, 255, 255)"></div>
              </div>
          </div>
          <div class="modal-body">
              <h4 class="text-center">
                  <span class="dialog-msg" >{{updatemeeting}}&nbsp;</span
        >
      </h4>

      <div class="d-flex justify-content-center">
        <button
          type="button "
          i18n="@@ok"
          (click)="onCloseHandled()"
          data-dismiss="modal "
          class="btn"
          style="
            color: white !important;
            border-radius: 4px !important;
           background-image: linear-gradient(to bottom, #337ab7 0, #265a88 100%);
          "
        >
          OK
        </button>
      </div>
    </div>
  </div>
</div>
</div>
<!-- Success Modal End -->
<!-- Error Modal Start -->
<div
class="modal"
id="staticBackdrop1"
data-backdrop="static"
tabindex="-1"
role="dialog"
[ngStyle]="{ display: display1 }"
aria-labelledby="staticBackdropLabel"
aria-hidden="true"
>
<div class="modal-dialog modal-dialog-centered" role="document">
  <div class="modal-content">
    <div class="modal-header">
      <div class="col-12">
        <div
          class="swal2-icon swal2-error swal2-animate-error-icon"
          style="display: flex; justify-content: center"
        >
          <span class="swal2-x-mark"
            ><span class="swal2-x-mark-line-left"></span
            ><span class="swal2-x-mark-line-right"></span
          ></span>
          </div>
      </div>
  </div>
  <div class="modal-body">
      <h6 style="text-align: center">
          <span  class="dialog-msg">{{errmsg}}</span>
          <br />
      </h6>

      <div class="d-flex justify-content-center mt-4">
        <button
          class="btn"
          (click)="onCloseHandled1()"
          i18n="@@ok"
          style="
            background-image: -webkit-linear-gradient(top, #d9534f 0, #c12e2a 100%);
            color: white !important;
            border-radius: 4px !important;
          "
        >
          Ok
        </button>
      </div>
    </div>
  </div>
</div>
</div>
<!-- Error Modal End -->
