  [fullScreen]="true">

</ngx-spinner>
<app-topbar></app-topbar>
<!-- ======= Header ======= -->
<div class="container-fluid sticky-nav" id="" style="background-color: #f2f2f2 !important">
  <div class="container-fluid" ngStickyNav>
    <nav class="navbar navbar-expand-lg">
      <a routerLink="/public" class="navbar-brand ">
        <img src="../../../assets/img/DBKL LOGO (Lorry).png" alt="" loading="lazy" />

      </a>

      <button class="navbar-toggler border-white" type="button" style="
          background-color: black !important;
          border: 1px solid white !important;
        " data-toggle="collapse" data-target="#navbarTogglerDemo02" aria-controls="navbarTogglerDemo02"
        aria-expanded="false" aria-label="Toggle navigation">
        <i class="fa fa-bars text-white"></i>
      </button>

      <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
        <ul class="navbar-nav ml-auto mt-2 mt-lg-0">
          <li class="nav-item">
            <a routerLink="/public" class="nav-link" style="color: #253d84 !important; cursor: pointer"
              i18n="@@home">HOME</a>
          </li>
        </ul>
      </div>
    </nav>
  </div>
</div>
<!-- End Header -->
<main>
  <section class="meeting" id="meeting">
    <div class="card">
      <!-- ======= Services Section ======= -->
      <div class="section-title">
        <span i18n="@@sos">SCHEDULE OF SERVICES</span>
        <h2 i18n="@@sos">SCHEDULE OF SERVICES</h2>
      </div>
      <div class="row">
        <div class="col-4"></div>
        <div class="col-4  d-flex justify-content-center">
          <div class="ttt">
            <a class="btn look_for" (click)="routeToNewApplication()" i18n="@@csh">

              COLLECTION SCHEDULE
            </a>

          </div>
          <div class="tttt">
            <a class="btn look_for" (click)="routeToNewApplication1()" i18n="@@cssh">

              CLEANING SCHEDULE
            </a>


          </div>
        </div>
        <div class="col-4"></div>
      </div>

      <div>
        <button (click)="cancel()" style="margin-right: 30px;" class="look_for_red" type="button" i18n="@@n74">
          Back
        </button>
      </div>
    </div>
  </section>
</main>
<!-- ======= Footer ======= -->
<app-footer></app-footer>
<!-- End Footer -->
