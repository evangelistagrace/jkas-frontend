<div *ngIf="catatan" style="margin-bottom: '20px'">
  <span class="catatan">{{catatan}}</span>
</div>
<div class="row">
  <div class="col-8">
    <textarea maxlength="50" [(ngModel)]="value"></textarea>
  </div>
  <div class="col-2">
    <i (click)="add()" class="fa fa-paper-plane chat" style="cursor: 'pointer';"></i>
  </div>
</div>
