<div *ngFor="let key of dataArray; index as i">
    <div *ngIf="data[i].site_id == v">
      <div *ngIf="key == ''; else files">
        <label class="custom-file-upload" >
          <input
            type="file"
            ng2FileSelect
            accept=".pdf"
            [uploader]="uploader"
            multiple
            (change)="uploadSubmit(data[i].site_id)"
          />
         <Span ><i  class="fa fa-cloud-upload"></i></Span>
        </label>
      </div>
      <ng-template #files>
        <a style="cursor: pointer;"
          target="_blank"
          (click)="getPdf(key)"
          >{{ key }}</a
        > 
        <!-- <i id="trash" class="fa fa-trash" (click)="deleteData(data[i].site_id)" aria-hidden="true"></i> -->
      </ng-template>
    </div>
  </div>
  


<div *ngFor="let key of data;index as i">
    <span *ngIf="key.site_id==keyValue">
        <span (click)="getPdf(key.maklum_balas_ketidakpatuhan)" style="color: #253d84 !important;cursor: pointer;">{{key.maklum_balas_ketidakpatuhan}}</span>
    </span> 
</div>
